name: Canary Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.repository_owner == 'bejamas'
    name: Build & Publish a canary release to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Set canary versions
        run: bun .github/version-release-canary.ts

      - name: Build packages
        run: bun run build:packages

      - name: Setup npmrc
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_ACCESS_TOKEN }}" > ~/.npmrc

      - name: Publish canary packages
        run: |
          # Publish the complete versioned set so canary workspace dependencies exist.
          bun .github/scripts/prepare-release.ts
          for package in packages/*/; do
            if [ -f "${package}package.json" ] && [ "$(jq -r '.private // false' "${package}package.json")" != "true" ]; then
              (cd "$package" && bun publish --tag canary --access public)
            fi
          done
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
